[project]
name = "lead-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]",
  "temporalio", "pydantic-ai-slim[openai,anthropic,google]", "playwright",
  "camoufox", "httpx", "cryptography", "python-multipart", "beautifulsoup4", "alembic", "python-dotenv", "Pillow", "av"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["services/api", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
