location ~ "^/(?:browser-control/[0-9a-fA-F-]{36}|api/agents/[0-9a-fA-F-]{36}/browser/screenshot)$" {
    proxy_pass http://lead_frame_output;
    proxy_set_header Host shui.click;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout; proxy_next_upstream_tries 2;
}
