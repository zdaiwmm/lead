name: lead-local
services:
  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: lead
      POSTGRES_USER: lead_owner
      POSTGRES_PASSWORD: ${LEAD_DB_OWNER_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lead-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_owner -d lead"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  temporal:
    image: temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:17233:7233"
      - "127.0.0.1:18233:8233"
    volumes:
      - lead-temporal:/data
    restart: unless-stopped
volumes:
  lead-postgres:
  lead-temporal:
