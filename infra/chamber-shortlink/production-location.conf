# Include in the shui.click TLS server after the collector routes have been verified.
# lead_chamber_analytics must point at the standalone production collector.
location ~ "^/chamber/r/(?:[A-Za-z0-9_-]{16}|[a-z]{1,2}_[A-Za-z0-9_-]{11})$" {
    if ($request_method != GET) { return 405; }
    proxy_pass http://lead_chamber_analytics;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host shui.click;
    proxy_set_header Content-Length "";
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Cookie "lead_click_browser=$cookie_lead_click_browser";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location /chamber/r/ { return 404; }

location = /_chamber/analytics/v1/report {
    if ($request_method != GET) { return 405; }
    proxy_pass http://lead_chamber_analytics;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host shui.click;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location = /_chamber/analytics/v1/links {
    if ($request_method != POST) { return 405; }
    client_max_body_size 8k;
    proxy_pass http://lead_chamber_analytics;
    proxy_pass_request_headers off;
    proxy_set_header Host shui.click;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}
