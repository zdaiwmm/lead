location ~ "^/chamber/r/(?:[A-Za-z0-9_-]{16}|[a-z]{1,2}_[A-Za-z0-9_-]{11})$" {
    if ($request_method != GET) { return 405; }
    rewrite ^/chamber(/r/.*)$ $1? break;
    proxy_pass http://unix:/run/lead-chamber-shortlink/redirect.sock;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host shui.click;
    proxy_set_header Content-Length "";
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Cookie "lead_click_browser=$cookie_lead_click_browser";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

location /chamber/ { return 404; }
