# OPTIONAL per-profile drop-in. Install root-owned only for the profile that
# deliberately uses this gateway, at lead-codex@PROFILE.service.d/egress.conf.
# The general executor template must not depend on this unit.
[Unit]
Requires=lead-codex-egress.service
After=lead-codex-egress.service

[Service]
# Mandatory in this opt-in profile: a missing private environment stops startup.
# The operator provisions only the authenticated proxy URL and no_proxy values.
# Existing UnsetEnvironment in the executor template must permit those variables
# and must still remove model keys/tokens and NODE_USE_ENV_PROXY. That independent
# template integration is required before installing this optional drop-in.
EnvironmentFile=/etc/lead-codex/network.env
ExecStartPre=/usr/bin/python3 -I -B /opt/lead-codex-egress/egress.py check-client-env
