name: Hosted-runner DNS recovery verification
on:
  pull_request:
    paths:
      - .github/workflows/dns-diagnostic.yml
      - .github/scripts/ci_dns_diagnostics.py
      - .github/scripts/ci_dns_recovery.py
      - .github/workflows/ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 .github/scripts/ci_dns_diagnostics.py before-compose
      - run: python3 scripts/bootstrap.py
      - name: Start the existing isolated test services
        run: docker compose --env-file .state/infra.env -f infra/compose.yaml up -d postgres temporal
      - if: always()
        run: python3 .github/scripts/ci_dns_diagnostics.py before-apt
      - name: Recover only the temporary runner resolver
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_ENVIRONMENT /usr/bin/python3 -IB .github/scripts/ci_dns_recovery.py apply
      - run: python3 .github/scripts/ci_dns_diagnostics.py after-recovery
      - name: Verify official archive HTTPS connectivity
        run: |
          for host in archive.ubuntu.com security.ubuntu.com; do
            timeout 15 getent ahostsv4 "$host"
            curl --fail --silent --show-error --proto '=https' --connect-timeout 5 --max-time 15 \
              --output /dev/null "https://$host/ubuntu/dists/noble/InRelease"
          done
      - if: always() && hashFiles('.state/infra.env') != ''
        run: docker compose --env-file .state/infra.env -f infra/compose.yaml down
      - name: Restore original resolver configuration
        if: always()
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_ENVIRONMENT /usr/bin/python3 -IB .github/scripts/ci_dns_recovery.py restore
      - if: always()
        run: python3 .github/scripts/ci_dns_diagnostics.py after-restore
