name: lead checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
      tools: ${{ steps.scope.outputs.tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_scope.py
  checks:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.2.0 ruff==0.17.3 PyYAML==6.0.3
      - run: ruff check services scripts tests infra/migrations
      - run: python scripts/check_repository.py
      - name: Scope and release contract regression
        run: python -m pytest --noconftest -q tests/test_ci_delivery.py
  delivery:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.kind == 'tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.2.0 PyYAML==6.0.3
      - name: Tool regression
        run: python -m pytest --noconftest -q tests/test_ci_delivery.py tests/test_tool_release.py tests/test_prepare_home_image.py tests/test_home_release.py tests/test_home_systemd_release.py
  backend:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.kind == 'application'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock.txt
      - run: .venv/bin/python scripts/bootstrap.py
      - name: Start isolated CI database
        run: |
          docker compose --env-file .state/infra.env -f infra/compose.yaml up -d postgres temporal
          for attempt in $(seq 1 30); do
            if docker compose --env-file .state/infra.env -f infra/compose.yaml exec -T postgres pg_isready -U lead_owner -d lead; then break; fi
            sleep 1
          done
          .venv/bin/python scripts/migrate.py
      - run: .venv/bin/ruff check services scripts tests infra/migrations
      - run: .venv/bin/python scripts/check_repository.py
      - name: Native Linux browser and namespace prerequisites
        run: |
          # Validate the signed Ubuntu mirror before changing the runner's list.
          # Existing Ubuntu suites, components and trust keyring stay in place.
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,RUNNER_ENVIRONMENT,http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY /usr/bin/python3 -IB .github/scripts/ci_apt_mirror.py
          # Playwright's own apt calls must inherit these bounds too.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAPT::Update::Error-Mode "any";\n' \
            | sudo tee /etc/apt/apt.conf.d/99lead-ci-acquire >/dev/null
          sudo --preserve-env=http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY apt-get update
          sudo --preserve-env=http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY apt-get install -y bubblewrap fonts-noto-cjk
          sudo --preserve-env=http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY "$PWD/.venv/bin/python" -m playwright install-deps firefox chromium
          .venv/bin/playwright install chromium
          .venv/bin/python scripts/ci_install_camoufox.py
          # This ephemeral runner permits user namespaces for the bwrap boundary.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          PYTHONPATH=services/api .venv/bin/python -m uvicorn lead_app.api:app --host 127.0.0.1 --port 8088 --no-access-log >.state/ci-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8088/lead.js >/dev/null; then break; fi
            sleep 1
          done
      - name: Database, media and authorization tests
        run: LEAD_TEST_CHANNEL_TEMPORAL=127.0.0.1:17233 LEAD_NETWORK_NAMESPACE=1 LEAD_BROWSER_TESTS=1 LEAD_WORKFLOW_TESTS=1 LEAD_GROWTH_TEST_ENV=1 .venv/bin/pytest -q --junitxml=.state/ci-tests.xml
      - if: always() && hashFiles('.state/infra.env') != ''
        run: docker compose --env-file .state/infra.env -f infra/compose.yaml down
  frontend:
    needs: scope
    if: needs.scope.outputs.kind == 'application'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        if: github.event_name != 'pull_request'
      - name: Reproduce home browser frames with synthetic images
        if: github.event_name != 'pull_request'
        run: |
          if ! command -v nginx >/dev/null; then
            sudo --preserve-env=http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY apt-get update
            sudo --preserve-env=http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY apt-get install -y nginx-light
          fi
          sudo unshare --mount --net --propagation private bash -eu -c '
            ip link set lo up
            mount -t tmpfs tmpfs /run
            mkdir -p /run/lead-home/bin/web
            mount --bind "$PWD" /run/lead-home/bin/web
            "$1" ../../tests/home_browser_frames.cjs ../../infra/home-browser-frames
          ' bash "$(command -v node)"
      - name: Package the tested Linux application
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          sudo --preserve-env=http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY apt-get install -y squashfs-tools
          ../../scripts/build_home_image.sh "$GITHUB_SHA" "$RUNNER_TEMP/lead.squashfs"
          for file in ../../infra/home-browser-frames/*; do
            unsquashfs -cat "$RUNNER_TEMP/lead.squashfs" "home-browser-frames/${file##*/}" | cmp "$file" -
          done
      - name: Verify non-root access to the exact release image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          image_root=$(mktemp -d /tmp/lead-image-root.XXXXXX)
          trap 'if mountpoint -q "$image_root"; then sudo umount "$image_root"; fi; rmdir "$image_root"' EXIT
          sudo mount -o loop,ro,nodev,nosuid "$RUNNER_TEMP/lead.squashfs" "$image_root"
          sudo setpriv --reuid=65534 --regid=65534 --clear-groups /usr/bin/python3 -IB - "$image_root" "$GITHUB_SHA" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          assert os.getuid() == 65534 and os.getgid() == 65534
          assert stat.S_IMODE(root.stat().st_mode) == 0o755
          assert (root / "REVISION").read_text().strip() == sys.argv[2]
          launcher = root / "services/api/lead_app/channel_executor.py"
          compile(launcher.read_bytes(), str(launcher), "exec")
          print("Exact release image root, REVISION and executor source are readable by non-root")
          PY
      - name: Retain the exact release image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lead-home-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lead.squashfs
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  namespace:
    needs: scope
    if: github.event_name != 'pull_request' && needs.scope.outputs.kind != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable rootless namespaces on ephemeral runner
        if: needs.scope.outputs.kind == 'application'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: docker build --secret id=lead_ca,src=/etc/ssl/certs/ca-certificates.crt -f infra/namespace-test.Dockerfile -t lead-namespace-test:ci .
        if: needs.scope.outputs.kind == 'application'
      - name: Independent systemd image and recovery drill
        run: |
          sudo --preserve-env=http_proxy,https_proxy,all_proxy,no_proxy,HTTP_PROXY,HTTPS_PROXY,ALL_PROXY,NO_PROXY apt-get install -y squashfs-tools
          sudo env LEAD_DISPOSABLE_RUNNER=1 /usr/bin/python3 -IB tests/home_mount_drill.py
      - name: Independent executor systemd binding preservation drill
        run: sudo env LEAD_DISPOSABLE_RUNNER=1 /usr/bin/python3 -IB tests/home_executor_systemd_drill.py
      - name: Independent tool install and rollback drill
        run: sudo env LEAD_DISPOSABLE_RUNNER=1 /usr/bin/python3 -IB tests/tool_install_drill.py
      - name: Rootless isolated transport contract
        if: needs.scope.outputs.kind == 'application'
        run: docker run --rm --network none --cap-drop ALL --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined lead-namespace-test:ci
  verified:
    needs: [scope, checks, backend, frontend, namespace, delivery]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check required results
        env:
          SCOPE: ${{ needs.scope.outputs.kind }}
          EVENT: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py
      - name: Application verification
        if: github.event_name != 'pull_request' && needs.scope.outputs.kind == 'application'
        run: echo 'Full application verification passed'
      - name: Tool verification
        if: github.event_name != 'pull_request' && needs.scope.outputs.kind == 'tools'
        run: echo 'Full tool verification passed'
      - name: Documentation verification
        if: github.event_name != 'pull_request' && needs.scope.outputs.kind == 'docs'
        run: echo 'Documentation verification passed'
      - name: PR checks
        if: github.event_name == 'pull_request'
        run: echo 'Fast PR checks passed; release verification runs on main'
  tool-bundle:
    needs: [scope, verified]
    if: always() && github.event_name != 'pull_request' && needs.scope.result == 'success' && needs.verified.result == 'success' && needs.scope.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build tested tools
        run: python3 scripts/build_tool_bundle.py "$GITHUB_SHA" "$RUNNER_TEMP/lead-tools.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lead-tools-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lead-tools.tar
          if-no-files-found: error
          retention-days: 7
