<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260" style="width:100%;max-width:1280px;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">lead 像素接入流程 v5：页面进度，单一任务弹窗</title>
<desc id="desc">未接入时获客效果区域只展示嵌入代码、安装检测、事件测试三阶段进度及当前任务。嵌入指引、安装检测、事件设置与测试各使用独立弹窗。完成检测后，页面只保留统一事件入口；事件选择、添加、设置和测试均在弹窗内完成。接入后只展示访客、会话和事件汇总，点击事件查看明细。事件选择和设置测试可查看独立标准事件参考表，返回保留草稿。Agent 分享链接通过 lr 自动归因，不占用安装引导。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#777582" stroke-width="1.2"/></marker>
<style>
text{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#e9e8ef;font-size:15px}.title{font-size:28px;font-weight:500}.section{font-size:19px;font-weight:500}.small{font-size:12px;fill:#a8a5b4}.label{font-size:12px;fill:#ef8a77}.center{text-anchor:middle;dominant-baseline:middle}.node{fill:#24242c;stroke:#41404b;stroke-width:1}.page{fill:#26252e;stroke:#646075;stroke-width:1}.ok{fill:#212c29;stroke:#4b7666;stroke-width:1}.edge{fill:none;stroke:#777582;stroke-width:1.3;marker-end:url(#arrow)}.dashed{stroke-dasharray:5 5}.line{stroke:#36353e;stroke-width:1}.green{fill:#99d5b8}
</style></defs>
<rect width="1280" height="1260" fill="#17171d"/>
<text x="60" y="62" class="title">页面展示进度，弹窗只做一件事</text>
<text x="60" y="94" class="small">lead · 像素接入原型 v5 · 2026.10.30</text>
<text x="60" y="143" class="label">工作台 / 获客效果区域</text>
<rect x="60" y="166" width="1160" height="100" rx="10" class="page"/>
<text x="88" y="197">未接入时</text><text x="88" y="228" class="small">只保留接入进度与当前步骤按钮</text>
<text x="495" y="204" class="center">① 嵌入代码</text><path d="M580 204H662" class="edge"/>
<text x="744" y="204" class="center">② 安装检测</text><path d="M829 204H911" class="edge"/>
<text x="1000" y="204" class="center">③ 事件测试</text>

<path d="M495 266V301H230V337" class="edge"/>
<text x="60" y="312" class="label">独立弹窗</text>
<rect x="60" y="337" width="340" height="140" rx="10" class="node"/>
<text x="84" y="367">A · 嵌入像素代码</text>
<text x="84" y="399" class="small">基础代码 + 粘贴位置</text>
<text x="84" y="429" class="small">复制代码</text><text x="84" y="455" class="small">已发布 → 关闭指引，进入检测</text>
<path d="M400 408H470" class="edge"/>
<rect x="470" y="337" width="340" height="140" rx="10" class="node"/>
<text x="494" y="367">B · 检测像素安装</text>
<text x="494" y="399" class="small">检测网址 + 检测结果</text>
<text x="494" y="429" class="small">未收到 / 域名错误 / 网络失败：原位重试</text>
<text x="494" y="455" class="small">收到 PageView → 完成检测</text>
<path d="M810 408H880" class="edge"/>
<rect x="880" y="337" width="340" height="140" rx="10" class="page"/>
<text x="904" y="367">回到页面 · 统一事件入口</text>
<text x="904" y="399" class="small">只保留进度与「事件设置与测试」按钮</text>
<text x="904" y="429" class="small">菜单也只提供统一入口，不逐项列事件</text>
<text x="904" y="455" class="small">标准事件与自定义事件均从此进入</text>

<path d="M1050 477V526" class="edge"/>
<rect x="880" y="526" width="340" height="140" rx="10" class="node"/>
<text x="904" y="556">C · 事件设置与测试弹窗</text>
<text x="904" y="588" class="small">事件列表 → 添加 / 选择 → 设置与测试</text>
<text x="904" y="618" class="small">保存并测试；失败保留输入并重试</text>
<text x="904" y="644" class="small">测试通过回到事件列表，汇总测试状态</text>

<path d="M880 596H810" class="edge"/>
<rect x="470" y="526" width="340" height="140" rx="10" class="page"/>
<text x="494" y="556">弹窗内 · 完成接入</text>
<text x="494" y="588" class="small">任一业务事件通过测试后，可完成接入</text>
<text x="494" y="618" class="small">其余事件按需继续设置与测试</text>
<text x="494" y="644" class="small">测试记录独立于正式数据</text>

<path d="M470 596H400" class="edge"/>
<rect x="60" y="526" width="340" height="140" rx="10" class="ok"/>
<text x="84" y="556" class="green">接入后 · 显示获客指标</text>
<text x="84" y="588" class="small">访客 / 会话 / 事件汇总</text>
<text x="84" y="618" class="small">点击事件 → 各事件详细数据</text>
<text x="84" y="644" class="small">未接入与暂无数据分别显示</text>

<path d="M1220 408H1244V695H230V666" class="edge dashed"/>
<text x="650" y="716" class="small center">稍后配置业务事件：可先接入访问统计，不标记业务测试已通过</text>
<text x="60" y="752" class="small">复制或声明已发布只推进嵌入步骤；收到 PageView 才视为安装检测通过。关闭弹窗或刷新页面后可继续。</text>
<text x="60" y="792" class="label">按需查看</text>
<rect x="60" y="814" width="550" height="88" rx="10" class="page"/>
<text x="84" y="846">获客效果 · 事件 → 事件明细</text>
<text x="84" y="877" class="small">各事件次数 / 触发人数 / 最近发生 / 接入状态；统计口径直接展示</text>
<rect x="670" y="814" width="550" height="88" rx="10" class="node"/>
<text x="694" y="846">事件弹窗 → 标准事件参考</text>
<text x="694" y="877" class="small">独立表格与名称查找；返回保留设置与测试结果</text>
<g transform="translate(0 160)">
<path d="M60 780H1220" class="line"/>

<text x="60" y="824" class="section">Agent 来源自动关联，不占用接入引导</text>
<rect x="60" y="854" width="240" height="78" rx="9" class="node"/>
<text x="180" y="880" class="center">分享链接携带 lr</text><text x="180" y="907" class="small center">来源码映射 Agent、渠道与内容</text>
<path d="M300 893H350" class="edge"/>
<rect x="350" y="854" width="240" height="78" rx="9" class="node"/>
<text x="470" y="880" class="center">像素按项目上报</text><text x="470" y="907" class="small center">服务器校验后记录独立触点</text>
<path d="M590 893H640" class="edge"/>
<rect x="640" y="854" width="240" height="78" rx="9" class="node"/>
<text x="760" y="880" class="center">用户 / 订单保存来源</text><text x="760" y="907" class="small center">站内跳转保留；换渠道新增触点</text>
<path d="M880 893H930" class="edge"/>
<rect x="930" y="854" width="290" height="78" rx="9" class="ok"/>
<text x="1075" y="880" class="center green">业务事件归因到原来源</text><text x="1075" y="907" class="small center">异步支付沿用订单保存的触点</text>

<text x="60" y="978" class="small">没有有效来源的事件保留为未归因。事件、用户、订单分别去重；业务发生时间与接收时间分别记录。</text>
<text x="60" y="1008" class="small">归因调试移到独立的原型工具页面，安装与事件弹窗中不再混入来源管理、日志和规则说明。</text>
<text x="60" y="1060" class="small">本图为产品交互草案。检测、上报与归因仅在原型本地模拟，正式 SDK / API 未在本轮实现。</text>
</g>
</svg>
