function pushEvent(name,kind,touchId,mode='normal',at=Date.now(),orderId=null){
const d=state.demo,previous=d.logs.find(l=>l.kind===kind&&l.status==='accepted'),id=mode==='duplicate'&&previous?previous.id:'demo_event_'+(++d.sequence);
const business=kind==='purchase'?'purchase:'+(orderId||'demo_order_one'):kind==='registration'?'signup:demo_visitor_'+d.visitor:kind==='activation'?'activation:v1:demo_visitor_'+d.visitor:null;
let status='accepted',note='';
if(mode==='missing'){status='rejected';note='缺少业务编号。';}
else if(d.eventIds.includes(id)||(business&&d.businessKeys.includes(business))){status='duplicate';note='事件或业务编号已存在，本次不新增计数。';}
else{d.eventIds.push(id);if(business)d.businessKeys.push(business);note=touchId?'来源已验证。':'保留为未归因。';}
const t=touchById(touchId),now=Date.now();
const record={id,name,kind,status,touchId:t?.id||null,source:sourceName(t),note,occurred:date(new Date(at))+' '+time(new Date(at)),time:time(new Date(now)),payload:{pixel_id:PIXEL,event_id:id,event_name:name,anonymous_id:'demo_visitor_'+d.visitor,session_id:'demo_session_'+d.visitor,user_id:kind==='pageview'?null:'demo_user_'+d.visitor,touchpoint_id:t?.id||null,occurred_at:new Date(at).toISOString(),received_at:new Date(now).toISOString(),...(orderId?{order_id:orderId}:{})}};
d.logs.unshift(record);d.logs=d.logs.slice(0,16);return record;}

function receiveVisit(codeValue,mode='normal'){
const d=state.demo;
if(!state.installed){d.message='尚未安装像素，未收到网站事件。';return;}
let candidate=sources.find(s=>s.code===codeValue),why='';
if(mode==='invalid'){candidate=null;why='来源标记无效';}
if(mode==='mismatch'){candidate=null;why='来源标记属于其他项目';}
if(candidate){const t={id:'demo_touch_'+(++d.sequence),pixel:PIXEL,visitor:d.visitor,at:Date.now(),...candidate};d.touches.push(t);d.currentTouch=t.id;}
else if(mode!=='navigate'){d.currentTouch=null;}
const matched=scopeTouch();
d.message=candidate?'来源已关联：'+candidate.agent+' / '+candidate.channel:mode==='navigate'?'站内跳转，沿用已验证的推广来源。':why?why+'，按未归因接收。':'自然访问，按未归因接收。';
pushEvent('PageView','pageview',matched?.id||null);
}

function freshVisitor(){const d=state.demo;d.visitor++;d.currentTouch=null;}

function demo(action){

render();}

const reportSample={visitors:1280,sessions:1632,events:{registration:{count:86,users:86,last:'今天 14:32'},activation:{count:51,users:51,last:'今天 14:26'},purchase:{count:18,users:14,last:'今天 14:18'}}};
const reportData=()=>state.reportSample&&state.ready?reportSample:null;
const number=v=>new Intl.NumberFormat('zh-CN').format(v);
const reportPeriod=()=>reportData()?'近 30 天 · 示例数据':'近 30 天 · 正式数据';
function renderEventDetails(){
const report=reportData();
const rows=Object.entries(state.events).map(([id,e])=>{const t=eventTypes[id],connected=!!e.verified,data=report?.events[id];return '<tr><td>'+esc(t.title)+'<code>'+esc(t.name)+'</code></td><td data-label="事件次数">'+(data?number(data.count):connected?'—':'未接入')+'</td><td data-label="触发人数">'+(data?number(data.users):connected?'—':'未接入')+'</td><td data-label="最近发生">'+(data?data.last:'—')+'</td><td data-label="接入状态"><span class="state '+(connected?'success':'muted')+'">'+(connected?'已接入':e.configured?'待测试':'未接入')+'</span></td></tr>';}).join('');
$('#event-details-body').innerHTML='<p class="report-context">'+reportPeriod()+'</p><table class="table report-table" aria-label="各事件详细数据"><thead><tr><th scope="col" style="width:30%">事件</th><th scope="col">事件次数</th><th scope="col">触发人数</th><th scope="col">最近发生</th><th scope="col">接入状态</th></tr></thead><tbody>'+rows+'</tbody></table>'+(report?'':'<p class="empty">'+(verified().length?'暂无正式事件数据':'尚未接入业务事件')+'</p>')+'<section class="table-rules" aria-label="统计口径"><h3>统计口径</h3><p class="mini secondary">事件按业务规则去重计次，汇总各业务事件；不含页面访问和测试数据。触发人数按每个事件分别去重，不相加为总人数。</p></section>';
}
function renderReference(query=''){
const q=query.trim().toLowerCase(),list=standardEvents.filter(e=>[e.title,e.name,e.when,e.kind||''].some(v=>v.toLowerCase().includes(q)));
$('#reference-table').innerHTML=list.length?'<table class="table report-table reference-table" aria-label="标准事件参考表"><thead><tr><th scope="col">事件</th><th scope="col">触发时机</th><th scope="col">事件类型</th></tr></thead><tbody>'+list.map(e=>'<tr><td>'+esc(e.title)+'<code>'+esc(e.name)+'</code>'+'</td><td data-label="触发时机">'+esc(e.when)+'</td><td data-label="事件类型"><span class="secondary">'+(e.name==='PageView'?'自动采集':e.id==='activation'?'自定义事件':'标准事件')+'</span></td></tr>').join('')+'</tbody></table>':'<p class="reference-empty" role="status">没有匹配的事件</p>';
}
function openReference(){
if(testState==='checking'&&activeModal==='event')return;
referenceReturn={modal:activeModal,element:document.activeElement};
const previous=document.querySelector('dialog[open]');if(previous)previous.close();
activeModal='reference';$('#reference-search').value='';renderReference();
$('#reference-return').textContent=referenceReturn.modal==='event'?'返回事件设置':referenceReturn.modal==='metrics'?'返回事件明细':'返回事件选择';
$('#reference-dialog').showModal();
}
function render(){
if(isLab){$('#product').hidden=true;$('#lab').hidden=false;const open=Array.from($('#lab-content').querySelectorAll('details[open]')).map(d=>d.querySelector('summary').textContent);$('#lab-content').innerHTML=sourcesPage();for(const d of $('#lab-content').querySelectorAll('details'))if(open.includes(d.querySelector('summary').textContent))d.open=true;}
else{$('#acquisition').innerHTML=acquisition();}
$('#base-code').textContent=baseCode();
$('#preview').value=state.ready?(state.reportSample?'ready-sample':'ready'):state.installed?'connected':state.embedded?'embedded':'new';
$('#scenario').value=scenario;save();
}
function detectBody(){
const good=detectState==='success',bad=detectState==='error',loading=detectState==='checking';
return '<div class="field"><label for="check-url">检测网址</label><input id="check-url" type="url" value="'+esc(state.site)+'" '+(loading?'disabled':'')+'></div><div class="detect-result" role="status"><div class="result-icon '+(good?'good':bad?'bad':'')+'">'+(loading?'<span class="spinner"></span>':icon(good?'check':bad?'code':'clock'))+'</div><h3 class="'+(bad?'danger':'')+'">'+(good?'像素已连接':bad?esc(checkError):loading?'正在检测…':'等待检测')+'</h3>'+(good?'<p class="mini muted">PageView · '+time(new Date(state.installAt))+'</p>':'')+'</div>';
}
function renderDetect(){const good=detectState==='success';$('#detect-body').innerHTML=detectBody();$('#detect-footer').innerHTML='<button class="quiet" data-close>'+(good?'关闭':'稍后检测')+'</button><div class="right">'+(detectState==='error'?'<button class="quiet" data-action="back-embed">查看嵌入指引</button>':'')+'<button class="primary" data-action="'+(good?'detect-done':'check-install')+'" '+(detectState==='checking'?'disabled':'')+'>'+(good?'完成检测':detectState==='error'?'重新检测':'开始检测')+'</button></div>';}
function eventDeveloper(id){
const e=eventDraft,dedup=({registration:'按用户编号。',activation:'按用户编号与规则版本。',purchase:'按订单编号；人数按用户编号。'})[id]||'按事件编号；人数按用户或匿名访客编号。';
return '<details class="advanced"><summary>开发接入</summary><div><div class="field"><label for="event-method">上报方式</label><select id="event-method"><option value="browser" '+(e.method==='browser'?'selected':'')+'>浏览器</option><option value="server" '+(e.method==='server'?'selected':'')+'>服务端</option></select></div><dl><div class="rule"><dt>去重</dt><dd>'+dedup+'</dd></div><div class="rule"><dt>业务来源</dt><dd>沿用已验证触点，异步支付读取订单保存的来源。</dd></div></dl></div></details>';
}
function eventStatus(e){return e.verified?'✓ 测试通过':e.configured?'待测试':'待设置';}
function managerRows(){
const query=eventSearch.toLowerCase();
const list=Object.entries(state.events).filter(([id,e])=>[eventTypes[id].title,eventTypes[id].name].some(v=>v.toLowerCase().includes(query)));
return list.length?list.map(([id,e])=>{const t=eventTypes[id];return '<div class="event-row"><div>'+esc(t.title)+'<code>'+esc(t.name)+'</code><p class="mini '+(e.verified?'success':'muted')+'">'+eventStatus(e)+'</p></div><button data-edit-event="'+esc(id)+'" aria-label="设置并测试'+esc(t.title)+'">'+(e.verified?'重新测试':'设置并测试')+'</button></div>';}).join(''):'<p class="empty" role="status">没有匹配的事件</p>';
}
function renderEvent(){
$('#event-title').innerHTML='事件设置与测试<span class="demo-badge">演示</span>';
if(eventView==='list'){
$('#event-body').innerHTML='<div class="event-manager-tools"><h3>已添加事件</h3><div class="event-manager-actions"><button class="quiet small" data-action="reference-events">标准事件参考</button><button class="small" data-action="add-event">添加事件</button></div></div><div class="event-manager-search field"><label for="event-search">查找已添加事件</label><input id="event-search" type="search" value="'+esc(eventSearch)+'" placeholder="事件名称或标识"></div><div id="manager-rows">'+managerRows()+'</div>';
$('#event-footer').innerHTML='<button class="quiet" data-action="'+(state.ready?'close-events':'visits-only')+'">'+(state.ready?'关闭':'稍后配置事件')+'</button><button class="primary" data-action="'+(state.ready?'close-events':'finish-events')+'" '+(!state.ready&&!verified().length?'disabled':'')+'>'+(state.ready?'完成':'完成接入')+'</button>';return;
}
if(eventView==='add'){
const options=standardEvents.filter(e=>e.name!=='PageView'&&!state.events[e.id]);
if(!addDraft.type)addDraft.type=options[0]?.id||'custom';
$('#event-body').innerHTML='<div class="event-manager-tools"><h3>添加事件</h3><button class="quiet small" data-action="reference-events">标准事件参考</button></div><div class="event-add-fields"><div class="field"><label for="new-event-type">事件类型</label><select id="new-event-type">'+options.map(e=>'<option value="'+esc(e.id)+'" '+(addDraft.type===e.id?'selected':'')+'>'+esc(e.title)+' · '+esc(e.name)+'</option>').join('')+'<option value="custom" '+(addDraft.type==='custom'?'selected':'')+'>自定义事件</option></select></div>'+(addDraft.type==='custom'?'<div class="field"><label for="custom-event-title">显示名称</label><input id="custom-event-title" value="'+esc(addDraft.title)+'" placeholder="例如：导出报告"></div><div class="field"><label for="custom-event-name">事件标识</label><input id="custom-event-name" value="'+esc(addDraft.name)+'" placeholder="例如：ReportExported" aria-describedby="custom-name-hint"><p id="custom-name-hint" class="mini muted">字母开头，最多 64 个字母、数字或下划线。</p></div>':'<p class="secondary mini">'+esc(eventTypes[addDraft.type].where)+'</p>')+'</div>'+(addError?'<p class="message-error" role="alert">'+esc(addError)+'</p>':'');
$('#event-footer').innerHTML='<button class="quiet" data-action="event-list">返回事件列表</button><button class="primary" data-action="create-event">添加并设置</button>';return;
}
const id=state.selectedEvent,e=eventDraft,type=eventTypes[id],opened=$('#event-body details')?.open;
$('#event-body').innerHTML='<div class="event-editor-title"><h3>'+esc(type.title)+'</h3><code>'+esc(type.name)+'</code></div>'+((id==='activation'||type.custom)?'<div class="field"><label for="definition">'+(id==='activation'?'核心行为':'触发行为')+'</label><input id="definition" value="'+esc(e.definition)+'" placeholder="例如：首次成功导出报告"></div>':'<p class="secondary">'+esc(type.where)+'</p>')+'<div class="code-top mt16"><span class="mini muted">事件代码</span><div class="flex"><button class="quiet small" data-action="reference-events" '+(testState==='checking'?'disabled':'')+'>标准事件参考</button><button class="quiet small" data-action="copy-event">复制代码</button></div></div>'+code(eventCode(id,e))+(testState!=='idle'?'<div class="result-inline" role="status"><span class="'+(testState==='success'?'success':testState==='error'?'danger':'muted')+'">'+(testState==='checking'?'正在等待测试事件…':esc(testMessage))+'</span>'+(testState==='success'?'<p class="mini muted">'+esc(type.name)+' · '+time(new Date(testTime))+'</p>':'')+'</div>':'')+eventDeveloper(id);
if(opened)$('#event-body details').open=true;
$('#event-footer').innerHTML='<button class="quiet" data-action="event-list" '+(testState==='checking'?'disabled':'')+'>返回事件列表</button><button class="primary" data-action="'+(testState==='success'?'event-done':'test-event')+'" '+(testState==='checking'?'disabled':'')+'>'+(testState==='success'?'完成测试':testState==='error'?'重新测试':'保存并测试')+'</button>';
}
function editEvent(id){
if(!state.events[id])return;
state.selectedEvent=id;eventView='edit';eventDraft={...(eventDrafts[id]||state.events[id])};testState='idle';testMessage='';renderEvent();$('#event-body').scrollTop=0;($('#definition')||$('#event-body [data-action="copy-event"]'))?.focus({preventScroll:true});
}
function eventList(){
if(eventView==='edit'&&eventDraft)eventDrafts[state.selectedEvent]={...eventDraft};
eventView='list';eventDraft=null;testState='idle';testMessage='';renderEvent();$('#event-body').scrollTop=0;$('#event-search')?.focus({preventScroll:true});
}
function createEvent(){
let id=addDraft.type,metadata;
if(id==='custom'){
const name=addDraft.name.trim(),title=addDraft.title.trim();
if(!title){addError='请填写显示名称';renderEvent();return;}
if(!/^[A-Za-z][A-Za-z0-9_]{0,63}$/.test(name)){addError='请填写符合格式的事件标识';renderEvent();return;}
if(standardEvents.some(e=>e.name.toLowerCase()===name.toLowerCase())||Object.values(state.events).some(e=>(e.name||'').toLowerCase()===name.toLowerCase())){addError='该事件标识已存在';renderEvent();return;}
id='custom:'+name;metadata={name,title,custom:true};eventTypes[id]={name,title,custom:true,where:'在指定业务行为完成后上报。'};
}
if(state.events[id]){addError='该事件已添加';renderEvent();return;}
state.events[id]={configured:false,received:false,verified:false,method:'browser',definition:'',...metadata};save();addError='';editEvent(id);
}

function focusMain(){const target=state.ready?$('#acquisition summary'):$('#acquisition button:not(:disabled)');target?.focus({preventScroll:true});}
function closeActive(focus=true){
if(activeModal==='reference'&&referenceReturn){
const back=referenceReturn;referenceReturn=null;$('#reference-dialog').close();
if(focus&&back.modal){activeModal=back.modal;$(back.modal==='event'?'#event-dialog':'#event-details-dialog').showModal();if(back.element?.isConnected)back.element.focus({preventScroll:true});return;}
if(focus){activeModal=null;if(back.element?.isConnected)back.element.focus({preventScroll:true});else focusMain();return;}
}
++token;busy=false;
const dialog=document.querySelector('dialog[open]');if(dialog)dialog.close();
activeModal=null;eventDraft=null;eventDrafts={};
if(focus){if(opener?.isConnected&&opener!==document.body)opener.focus({preventScroll:true});else focusMain();}
}
function openTask(task,id=null){
const previous=document.querySelector('dialog[open]');if(previous)previous.close();
++token;busy=false;activeModal=task;opener=document.activeElement;
document.querySelectorAll('details.settings-menu[open]').forEach(d=>d.open=false);
if(task==='metrics'){renderEventDetails();$('#event-details-dialog').showModal();}
if(task==='embed'){$('#copy-base').textContent='复制代码';$('#embed-dialog').showModal();}
if(task==='detect'){detectState='idle';checkError='';renderDetect();$('#detect-dialog').showModal();}
if(task==='event'){
if(!state.installed){openTask('detect');return;}
eventView='list';eventSearch='';eventDrafts={};eventDraft=null;testState='idle';testMessage='';renderEvent();$('#event-dialog').showModal();if(id)editEvent(id);
}
}
async function copyValue(value,button=null){try{await navigator.clipboard.writeText(value);if(button)button.textContent='已复制';else toast('已复制');}catch{if(button)button.textContent='请手动复制';else toast('请选中代码手动复制');}}
async function checkInstall(){
let url;try{url=new URL($('#check-url').value);}catch{}
if(!url||url.origin!==state.site){detectState='error';checkError='请填写当前项目的网站地址';renderDetect();return;}
const task=++token;detectState='checking';renderDetect();
await new Promise(resolve=>setTimeout(resolve,650));if(task!==token)return;
if(scenario==='ok'||scenario==='duplicate'){state.installed=true;state.embedded=true;state.installAt=Date.now();detectState='success';}
else{state.installed=false;state.ready=false;detectState='error';checkError=({waiting:'未收到像素数据',domain:'安装域名不匹配',network:'连接失败，请重试',missing:'未收到像素数据'})[scenario];}
render();renderDetect();
}
async function testEventSetup(){
const id=state.selectedEvent;
if((id==='activation'||eventTypes[id].custom)&&!eventDraft.definition.trim()){testState='error';testMessage=id==='activation'?'请填写核心行为':'请填写触发行为';renderEvent();return;}
state.events[id]={...eventDraft,configured:true,verified:false};render();
const task=++token;testState='checking';renderEvent();
await new Promise(resolve=>setTimeout(resolve,650));if(task!==token)return;
if(scenario==='ok'||scenario==='duplicate'){
const t=scopeTouch();if(scenario==='duplicate')pushEvent(eventTypes[id].name,id,t?.id||null,'normal',Date.now(),id==='purchase'?'demo_setup_order':null);
const r=pushEvent(eventTypes[id].name,id,t?.id||null,scenario==='duplicate'?'duplicate':'normal',Date.now(),id==='purchase'?'demo_setup_order':null);
state.events[id].verified=true;state.events[id].received=true;eventDraft={...state.events[id]};eventDrafts[id]={...eventDraft};testState='success';testTime=Date.now();testMessage=r.status==='duplicate'?'事件已接收，重复已忽略':'测试通过';
}else{testState='error';testMessage=({waiting:'尚未收到测试事件',domain:'事件来源不匹配',network:'连接失败，请重试',missing:'事件缺少必要字段'})[scenario];}
render();renderEvent();
}
function seed(value){
closeActive(false);state=defaults();scenario='ok';
if(value!=='new')state.embedded=true;
if(value==='connected'||value==='ready'||value==='ready-sample'){state.installed=true;state.installAt=Date.now();}
if(value==='ready'){state.ready=true;state.events.registration.configured=true;state.events.registration.verified=true;state.events.registration.received=true;}
if(value==='ready-sample'){state.ready=true;state.reportSample=true;for(const e of Object.values(state.events)){e.configured=true;e.verified=true;e.received=true;}}
if(isLab){state.installed=true;state.embedded=true;}render();
}
document.addEventListener('click',event=>{
const t=event.target.closest('button');if(!t||t.disabled)return;
if(t.hasAttribute('data-close')){closeActive();return;}
if(t.dataset.open){openTask(t.dataset.open);return;}
if(t.dataset.editEvent){editEvent(t.dataset.editEvent);return;}
if(isLab){
if(t.dataset.demo){demo(t.dataset.demo);return;}
if(t.dataset.selectSource!==undefined){state.source=Number(t.dataset.selectSource);render();return;}
if(t.dataset.copyLink!==undefined){copyValue(linkFor(Number(t.dataset.copyLink)));return;}
if(t.dataset.nav){location.href='./';return;}
}
switch(t.dataset.action){
case'reference-events':openReference();break;
case'add-event':eventView='add';addDraft={type:'',title:'',name:''};addError='';renderEvent();$('#new-event-type')?.focus({preventScroll:true});break;
case'event-list':case'event-done':eventList();break;
case'create-event':createEvent();break;
case'close-events':closeActive();break;
case'finish-events':if(verified().length){state.ready=true;state.visitOnly=false;closeActive(false);render();focusMain();}break;
case'copy-base':copyValue(baseCode(),t);break;
case'copy-event':copyValue(eventCode(state.selectedEvent,eventDraft),t);break;
case'embedded':state.embedded=true;render();openTask('detect');break;
case'back-embed':openTask('embed');break;
case'check-install':checkInstall();break;
case'detect-done':closeActive(false);render();focusMain();$('#acquisition').scrollIntoView({block:'nearest',behavior:'instant'});break;
case'test-event':testEventSetup();break;

case'finish':if(verified().length){state.ready=true;state.visitOnly=false;render();focusMain();}break;
case'visits-only':state.ready=true;state.visitOnly=true;closeActive(false);render();focusMain();break;
}
});
document.addEventListener('input',event=>{if(event.target.id==='event-search'){eventSearch=event.target.value;$('#manager-rows').innerHTML=managerRows();return;}if(event.target.id==='custom-event-title'){addDraft.title=event.target.value;addError='';$('#event-body .message-error')?.remove();return;}if(event.target.id==='custom-event-name'){addDraft.name=event.target.value;addError='';$('#event-body .message-error')?.remove();return;}if(event.target.id==='reference-search'){renderReference(event.target.value);return;}if(event.target.id==='definition'&&eventDraft){eventDraft.definition=event.target.value;const pre=$('#event-body .code');if(pre)pre.textContent=eventCode(state.selectedEvent,eventDraft);if(testState==='success'){const start=event.target.selectionStart,end=event.target.selectionEnd;testState='idle';renderEvent();const input=$('#definition');input.focus({preventScroll:true});input.setSelectionRange(start,end);}}});
document.addEventListener('change',event=>{
if(event.target.id==='new-event-type'){addDraft.type=event.target.value;addError='';renderEvent();$('#new-event-type')?.focus({preventScroll:true});}
if(event.target.id==='event-method'){eventDraft.method=event.target.value;testState='idle';renderEvent();}
if(event.target.id==='preview')seed(event.target.value);
if(event.target.id==='scenario')scenario=event.target.value;
});
for(const d of document.querySelectorAll('dialog'))d.addEventListener('cancel',event=>{event.preventDefault();closeActive();});
$('#reset').onclick=()=>{seed('new');document.querySelector('.tools').open=false;};
render();

</script>
</body>
</html>
